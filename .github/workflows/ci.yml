name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.0"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: python-${{ matrix.python-version }}
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Tests
        run: .venv/bin/python -m pytest -q
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Types
        run: .venv/bin/mypy adcg scripts scorer.py fetch_fda_and_hpa.py

  wheel:
    name: Installed wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: python-3.12
      - name: Build wheel
        run: uv build --wheel
      - name: Install wheel with locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/wheel-requirements.txt"
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-env"
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" --require-hashes --requirements "$RUNNER_TEMP/wheel-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" --no-deps dist/*.whl
          uv pip check --python "$RUNNER_TEMP/wheel-env/bin/python"
      - name: Check installed resources and safety gate outside the checkout
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/wheel-env/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_installed_wheel.py"'

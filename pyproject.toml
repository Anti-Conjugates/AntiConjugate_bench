[project]
name = "adc-guardrail"
version = "0.1.0"
description = "AntiConjugate: calibrated, abstaining ADC prescribing-risk agent + clinician mini-benchmark"
requires-python = ">=3.11"
dependencies = ["requests", "pandas", "numpy", "matplotlib", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" role="img" aria-labelledby="fig-why-wide-title fig-why-wide-desc" class="pf-svg" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif"><title id="fig-why-wide-title">Why this project exists</title><desc id="fig-why-wide-desc">Medicines are complex. AI assistants narrowed the knowledge gap and can act as agents, but they are not trust-ready for pharmacies or clinicians because they sound sure when they are wrong. This project builds a framework and test environment, starting with HER2-targeted antibody-drug conjugates used in breast cancer.</desc><defs><marker id="fig-why-wide-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7c86"></path></marker><marker id="fig-why-wide-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9a85"></path></marker></defs><rect width="700" height="280" rx="10" fill="#0b1216"></rect><g><path class="pf-flow" d="M220 64 L247 64" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-why-wide-arrow)"></path></g><g><path class="pf-flow" d="M450 64 L477 64" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-why-wide-arrow)"></path></g><g><path class="pf-flow" d="M580 108 L580 169" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-why-wide-arrow)"></path></g><g><path class="pf-flow" d="M480 216 L453 216" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-why-wide-arrow)"></path></g><g class="pf-node" style="--n:0"><rect x="20" y="20" width="200" height="88" rx="8" fill="#121d24" stroke="#6b7c86" stroke-width="1.6"></rect><text x="120" y="52.5" text-anchor="middle" fill="#eef3f4" font-size="14" font-weight="600">Medicines are complex</text><text x="120" y="69" text-anchor="middle" fill="#9aa9b0" font-size="12.5">components, labels,</text><text x="120" y="85.5" text-anchor="middle" fill="#9aa9b0" font-size="12.5">evidence trails</text></g><g class="pf-node" style="--n:1"><rect x="250" y="20" width="200" height="88" rx="8" fill="#121d24" stroke="#7fb2ff" stroke-width="1.6" stroke-dasharray="5 3"></rect><text x="350" y="52.5" text-anchor="middle" fill="#eef3f4" font-size="14" font-weight="600">AI narrowed the gap</text><text x="350" y="69" text-anchor="middle" fill="#9aa9b0" font-size="12.5">answers fast,</text><text x="350" y="85.5" text-anchor="middle" fill="#9aa9b0" font-size="12.5">acts as an agent</text></g><g class="pf-node" style="--n:2"><rect x="480" y="20" width="200" height="88" rx="8" fill="#121d24" stroke="#ff9a85" stroke-width="1.6"></rect><text x="580" y="52.5" text-anchor="middle" fill="#eef3f4" font-size="14" font-weight="600">Not trust-ready</text><text x="580" y="69" text-anchor="middle" fill="#9aa9b0" font-size="12.5">sounds sure when</text><text x="580" y="85.5" text-anchor="middle" fill="#9aa9b0" font-size="12.5">it is wrong</text></g><g class="pf-node" style="--n:3"><rect x="480" y="172" width="200" height="88" rx="8" fill="#121d24" stroke="#c8ff4d" stroke-width="1.6"></rect><text x="580" y="204.5" text-anchor="middle" fill="#eef3f4" font-size="14" font-weight="600">Framework + test env</text><text x="580" y="221" text-anchor="middle" fill="#9aa9b0" font-size="12.5">code checks claims,</text><text x="580" y="237.5" text-anchor="middle" fill="#9aa9b0" font-size="12.5">failures recorded</text></g><g class="pf-node" style="--n:4"><rect x="250" y="172" width="200" height="88" rx="8" fill="#121d24" stroke="#f0a974" stroke-width="1.6"></rect><text x="350" y="205" text-anchor="middle" fill="#eef3f4" font-size="14" font-weight="600">Starting point</text><text x="350" y="221" text-anchor="middle" fill="#9aa9b0" font-size="12">HER2 antibody-drug</text><text x="350" y="237" text-anchor="middle" fill="#9aa9b0" font-size="12">conjugates, breast cancer</text></g></svg>

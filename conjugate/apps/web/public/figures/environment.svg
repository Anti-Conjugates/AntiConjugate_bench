<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 502" width="1130" height="502" role="img" aria-labelledby="fig-env-wide-title fig-env-wide-desc" class="pf-svg" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif"><title id="fig-env-wide-title">What the agent is allowed to touch</title><desc id="fig-env-wide-desc">Local files: the ADCdb workbook snapshot with 31 ADCs and draft label paraphrases for Enhertu and Kadcyla. Live sources: ClinicalTrials.gov, PubMed, openFDA, DailyMed, ADCdb. Each live source is reached only through a fixed URL template written in code, and every fetch leaves a receipt with its HTTP status and a SHA-256 hash.</desc><defs><marker id="fig-env-wide-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7c86"></path></marker><marker id="fig-env-wide-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9a85"></path></marker></defs><rect width="1130" height="502" rx="10" fill="#0b1216"></rect><text x="20" y="34" fill="#c8ff4d" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">LOCAL, NO NETWORK</text><g class="pf-node" style="--n:0"><rect x="20" y="48" width="330" height="62" rx="8" fill="#121d24" stroke="#f0a974" stroke-width="1.6"></rect><text x="185" y="76.25" text-anchor="middle" fill="#eef3f4" font-size="15" font-weight="600">ADCdb workbook snapshot</text><text x="185" y="92.75" text-anchor="middle" fill="#9aa9b0" font-size="12.5">31 ADCs · ADCdb workbook</text></g><g class="pf-node" style="--n:1"><rect x="370" y="48" width="330" height="62" rx="8" fill="#121d24" stroke="#f0a974" stroke-width="1.6"></rect><text x="535" y="76.25" text-anchor="middle" fill="#eef3f4" font-size="15" font-weight="600">Label paraphrases</text><text x="535" y="92.75" text-anchor="middle" fill="#9aa9b0" font-size="12.5">Enhertu, Kadcyla · draft UK text</text></g><g><path class="pf-flow" d="M700 79 L800 79" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-env-wide-arrow)"></path></g><g class="pf-node" style="--n:2"><rect x="810" y="48" width="300" height="62" rx="8" fill="#121d24" stroke="#c8ff4d" stroke-width="1.6"></rect><text x="960" y="76.25" text-anchor="middle" fill="#eef3f4" font-size="15" font-weight="600">Read by source id</text><text x="960" y="92.75" text-anchor="middle" fill="#9aa9b0" font-size="12.5">receipt with content hash</text></g><text x="20" y="158" fill="#c8ff4d" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">LIVE SOURCE</text><text x="270" y="158" fill="#c8ff4d" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">FIXED URL TEMPLATE (IN CODE)</text><text x="800" y="158" fill="#c8ff4d" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">RECEIPT</text><g><g class="pf-node" style="--n:3"><rect x="20" y="176" width="200" height="40" rx="8" fill="#121d24" stroke="#f0a974" stroke-width="1.6"></rect><text x="120" y="201" text-anchor="middle" fill="#eef3f4" font-size="14" font-weight="600">ClinicalTrials.gov</text></g><g><path class="pf-flow" d="M220 196 L262 196" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-env-wide-arrow)"></path></g><g class="pf-node" style="--n:3"><rect x="270" y="176" width="480" height="40" rx="8" fill="#18242c" stroke="#c8ff4d" stroke-width="1.6"></rect><text x="284" y="201" fill="#c9d4d8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#eef3f4">clinicaltrials.gov</tspan>/api/v2/studies/{id}?fields=…</text></g><g><path class="pf-flow" d="M750 196 L792 196" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-env-wide-arrow)"></path></g><g class="pf-no
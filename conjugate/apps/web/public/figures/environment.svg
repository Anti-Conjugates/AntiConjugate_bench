="--n:7"><rect x="20" y="392" width="200" height="40" rx="8" fill="#121d24" stroke="#f0a974" stroke-width="1.6"></rect><text x="120" y="417" text-anchor="middle" fill="#eef3f4" font-size="14" font-weight="600">ADCdb</text></g><g><path class="pf-flow" d="M220 412 L262 412" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-env-wide-arrow)"></path></g><g class="pf-node" style="--n:7"><rect x="270" y="392" width="480" height="40" rx="8" fill="#18242c" stroke="#c8ff4d" stroke-width="1.6"></rect><text x="284" y="417" fill="#c9d4d8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><tspan fill="#eef3f4">adcdb.idrblab.net</tspan>/data/adc/details/{id}</text></g><g><path class="pf-flow" d="M750 412 L792 412" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-env-wide-arrow)"></path></g><g class="pf-node" style="--n:8"><rect x="800" y="392" width="310" height="40" rx="8" fill="#121d24" stroke="#7fe0a8" stroke-width="1.6"></rect><text x="814" y="417" fill="#7fe0a8" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">HTTP 200 · ok · c0cf6444e2ae…</text></g></g><text x="20" y="480" fill="#9aa9b0" font-size="13">The model never picks a URL. One fetch per reference, no retries, no fallback to the snapshot. Receipts are hashes of what came back, not signatures.</text></svg>

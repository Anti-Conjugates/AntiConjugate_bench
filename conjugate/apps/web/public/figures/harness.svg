<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 380" width="1130" height="380" role="img" aria-labelledby="fig-harness-wide-title fig-harness-wide-desc" class="pf-svg pf-harness" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif"><title id="fig-harness-wide-title">The harness: where code decides and where the model only suggests</title><desc id="fig-harness-wide-desc">A question passes a scope gate and a premise gate, both plain code. If either stops it, no model is called. Otherwise a Claude lead picks which checks to run, Claude workers run them in parallel, a deterministic verifier writes every verdict, and an omission gate keeps missing checks on the answer, sending the lead back once. Models never write verdicts.</desc><defs><marker id="fig-harness-wide-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7c86"></path></marker><marker id="fig-harness-wide-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9a85"></path></marker></defs><rect width="1130" height="380" rx="10" fill="#0b1216"></rect><g font-size="12.5"><g transform="translate(20 354)"><rect width="22" height="14" y="-11" rx="3" fill="#121d24" stroke="#c8ff4d" stroke-width="1.6"></rect><text x="28" fill="#c9d4d8">code decides</text></g><g transform="translate(138 354)"><rect width="22" height="14" y="-11" rx="3" fill="#121d24" stroke="#7fb2ff" stroke-width="1.6" stroke-dasharray="4 2"></rect><text x="28" fill="#c9d4d8">Claude suggests</text></g><g transform="translate(277 354)"><rect width="22" height="14" y="-11" rx="3" fill="#121d24" stroke="#ff9a85" stroke-width="1.6"></rect><text x="28" fill="#c9d4d8">stops, no model call</text></g></g><g><path class="pf-flow" d="M144 152 L155 152" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-harness-wide-arrow)"></path></g><g><path class="pf-flow" d="M282 152 L293 152" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-harness-wide-arrow)"></path></g><g><path class="pf-flow" d="M420 152 L431 152" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-harness-wide-arrow)"></path></g><g><path class="pf-flow" d="M558 152 L569 152" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-harness-wide-arrow)"></path></g><g><path class="pf-flow" d="M696 152 L707 152" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-harness-wide-arrow)"></path></g><g><path class="pf-flow" d="M834 152 L845 152" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-harness-wide-arrow)"></path></g><g><path class="pf-flow" d="M972 152 L983 152" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-harness-wide-arrow)"></path></g><g class="pf-node" style="--n:0"><rect x="20" y="110" width="124" height="84" rx="8" fill="#121d24" stroke="#6b7c86" stroke-width="1.6"></rect><text x="82" y="149" text-anchor="middle" fill="#eef3f4" font-size="14" font-weight="600">Question</text><text x="82" y="165" text-anchor="middle" fill="#9aa9b0" font-size="12">plain English</text></g><g class="pf-node" style="--n:1"><rect x="158" y="110" width="124" height="84" rx="8" fill="#121d24" stroke="#c8ff4d" stroke-width="1.6"></rect><text x="220" y="141" text-anchor="middle" fill="#eef3f4" font-size="14" font-weight="600">Scope gate</text><text x="220" y="157" text-anchor="middle" fill="#9aa9b0" font-size="12">code</text><text x="220" y="173" text-anchor="middle" fill="#9aa9b0" font-size="12">off-topic stops</text></g><g class="pf-node" style="--n:2"><rect x="296" y="110" width="124" height="84" rx="8" fill="#121d24" stroke="#c8ff4d" stroke-width="1.6"></rect><text x="358" y="141" text-anchor="middle" fill="#eef3f4" font-size="14" font-weight="600">Premise gate</text><text x="358" y="157" text-anchor="middle" fill="#9aa9b0" font-size="12">code</text><text x="358" y="173" text-anchor="middle" fill="#9aa9b0" font-size="12">checks the facts</text></g><g class="pf-node" style="--n:3"><rect x="434" y="110" width="124" height="84" rx="8" fill="#121d24" stroke="#7fb2ff" stroke-width="1.6" stroke-dasharray="5 3"></rect><text x="496" y="141" text-anchor="middle" fill="#eef3f4" font-size="14" font-weight="600">Claude lead</text><text x="496" y="157" text-anchor="middle" fill="#9aa9b0" font-size="12">model</text><text x="496" y="173" text-anchor="middle" fill="#9aa9b0" font-size="12">picks check ids</text></g><g><rect x="580" y="102" width="124" height="84" rx="8" fill="#121d24" stroke="#7fb2ff" stroke-opacity=".5" stroke-dasharray="5 3"></rect><rect x="576" y="106" width="124" height="84" rx="8" fill="#121d24" stroke="#7fb2ff" stroke-opacity=".7" stroke-dasharray="5 3"></rect><g class="pf-node" style="--n:4"><rect x="572" y="110" width="124" height="84" rx="8" fill="#121d24" stroke="#7fb2ff" stroke-width="1.6" stroke-dasharray="5 3"></rect><text x="634" y="141" text-anchor="middle" fill="#eef3f4" font-size="14" font-weight="600">Workers</text><text x="634" y="157" text-anchor="middle" fill="#9aa9b0" font-size="12">model, parallel</text><text x="634" y="173" text-anchor="middle" fill="#9aa9b0" font-size="12">one per check</text></g></g><g class="pf-node" style="--n:5"><rect x="710" y="110" width="124" height="84" rx="8" fill="#121d24" stroke="#c8ff4d" stroke-width="1.6"></rect><text x="772" y="141" text-anchor="middle" fill="#eef3f4" font-size="14" font-weight="600">Verifier</text><text x="772" y="157" text-anchor="middle" fill="#9aa9b0" font-size="12">code</text><text x="772" y="173" text-anchor="middle" fill="#9aa9b0" font-size="12">writes verdicts</text></g><g class="pf-node" style="--n:6"><rect x="848" y="110" width="124" height="84" rx="8" fill="#121d24" stroke="#c8ff4d" stroke-width="1.6"></rect><text x="910" y="141" text-anchor="middle" fill="#eef3f4" font-size="14" font-weight="600">Omission gate</text><text x="910" y="157" text-anchor="middle" fill="#9aa9b0" font-size="12">code</text><text x="910" y="173" text-anchor="middle" fill="#9aa9b0" font-size="12">gaps stay visible</text></g><g class="pf-node" style="--n:7"><rect x="986" y="110" width="124" height="84" rx="8" fill="#121d24" stroke="#7fe0a8" stroke-width="1.6"></rect><text x="1048" y="149" text-anchor="middle" fill="#eef3f4" font-size="14" font-weight="600">Answer</text><text x="1048" y="165" text-anchor="middle" fill="#9aa9b0" font-size="12">audit + sources</text></g><g class="pf-node" style="--n:3"><rect x="158" y="262" width="262" height="56" rx="8" fill="#121d24" stroke="#ff9a85" stroke-width="1.6"></rect><text x="289" y="287.25" text-anchor="middle" fill="#eef3f4" font-size="15" font-weight="600">Stopped before the model</text><text x="289" y="303.75" text-anchor="middle" fill="#9aa9b0" font-size="12.5">0 model calls</text></g><g><path class="pf-flow" d="M220 194 L220 258" fill="none" stroke="#ff9a85" stroke-width="1.6" marker-end="url(#fig-harness-wide-arrow-bad)"></path></g><g><path class="pf-flow" d="M358 194 L358 258" fill="none" stroke="#ff9a85" stroke-width="1.6" marker-end="url(#fig-harness-wide-arrow-bad)"></path></g><g><path class="pf-flow" d="M910 110 C910 40, 496 40, 496 107" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-harness-wide-arrow)"></path><text x="703" y="46" text-anchor="middle" fill="#9aa9b0" font-size="12">missing check: back to the lead, once</text></g><text x="772" y="220" text-anchor="middle" fill="#c8ff4d" font-size="12.5">only code writes verdicts</text></svg>

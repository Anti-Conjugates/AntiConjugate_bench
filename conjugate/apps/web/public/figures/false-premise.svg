<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 300" width="1130" height="300" role="img" aria-labelledby="fig-premise-wide-title fig-premise-wide-desc" class="pf-svg" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif"><title id="fig-premise-wide-title">A question with a false premise</title><desc id="fig-premise-wide-desc">Question: &quot;Kadcyla has a cleavable linker, so how fast is DM1 released in blood?&quot;. The premise gate compares &quot;cleavable&quot; with the recorded linker, Succinimidyl-4-(N-maleimidomethyl)cyclohexane-1-carboxylate (SMCC), and flags it (contradicted_linker) before any model call. The claim is still checked against the sources; the verifier&#x27;s recorded verdict is Not enough evidence, citing UK-KADCYLA-SMPC.</desc><defs><marker id="fig-premise-wide-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7c86"></path></marker><marker id="fig-premise-wide-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9a85"></path></marker></defs><rect width="1130" height="300" rx="10" fill="#0b1216"></rect><rect x="20" y="60" width="290" height="112" rx="8" fill="#121d24" stroke="#6b7c86"></rect><text x="36" y="92" fill="#eef3f4" font-size="16" text-anchor="start"><tspan>“Kadcyla</tspan><tspan> </tspan><tspan>has</tspan><tspan> </tspan><tspan>a</tspan><tspan> </tspan><tspan fill="#f0a974" font-weight="700">cleavable</tspan></text><text x="36" y="116" fill="#eef3f4" font-size="16" text-anchor="start"><tspan>linker,</tspan><tspan> </tspan><tspan>so</tspan><tspan> </tspan><tspan>how</tspan><tspan> </tspan><tspan>fast</tspan><tspan> </tspan><tspan>is</tspan><tspan> </tspan><tspan>DM1</tspan></text><text x="36" y="140" fill="#eef3f4" font-size="16" text-anchor="start"><tspan>released</tspan><tspan> </tspan><tspan>in</tspan><tspan> </tspan><tspan>blood?”</tspan></text><text x="20" y="44" fill="#c8ff4d" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">QUESTION</text><g><path class="pf-flow" d="M310 120 L352 120" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-premise-wide-arrow)"></path></g><g class="pf-node" style="--n:1"><rect x="360" y="70" width="300" height="100" rx="8" fill="#121d24" stroke="#c8ff4d" stroke-width="1.6"></rect><text x="510" y="100.75" text-anchor="middle" fill="#eef3f4" font-size="15" font-weight="600">Premise gate: flagged</text><text x="510" y="117.25" text-anchor="middle" fill="#9aa9b0" font-size="12.5">question says: cleavable</text><text x="510" y="133.75" text-anchor="middle" fill="#9aa9b0" font-size="12.5">sources say: SMCC</text><text x="510" y="150.25" text-anchor="middle" fill="#9aa9b0" font-size="12.5">(non-cleavable)</text></g><text x="360" y="200" fill="#9aa9b0" font-size="12.5">before any model call · shown to the user</text><g><path class="pf-flow" d="M660 120 L702 120" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-premise-wide-arrow)"></path></g><g class="pf-node" style="--n:2"><rect x="710" y="70" width="190" height="100" rx="8" fill="#121d24" stroke="#c8ff4d" stroke-width="1.6"></rect><text x="805" y="109" text-anchor="middle" fill="#eef3f4" font-size="15" font-weight="600">Verifier</text><text x="805" y="125.5" text-anchor="middle" fill="#9aa9b0" font-size="12.5">still checks the claim</text><text x="805" y="142" text-anchor="middle" fill="#9aa9b0" font-size="12.5">cited: Kadcyla label</text></g><g><path class="pf-flow" d="M900 120 L942 120" fill="none" stroke="#6b7c86" stroke-width="1.6" marker-end="url(#fig-premise-wide-arrow)"></path></g><g class="pf-node" style="--n:3"><rect x="950" y="84" width="160" height="72" rx="8" fill="#121d24" stroke="#7fe0a8" stroke-width="1.6"></rect><text x="1030" y="116.75" text-anchor="middle" fill="#eef3f4" font-size="14" font-weight="600">Not enough evidence</text><text x="1030" y="133.25" text-anchor="middle" fill="#9aa9b0" font-size="12.5">recorded verdict</text></g><text x="20" y="272" fill="#9aa9b0" font-size="13">The premise flag is a table mismatch against the workbook and label paraphrase, not a scientific ruling. The verdict comes from the verifier, not the model.</text></svg>
